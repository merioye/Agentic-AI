<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Agent · Memory Console</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1b1e24;
        --panel-2: #20242b;
        --border: #2b2f38;
        --text: #e7e6e2;
        --text-dim: #8b8d96;
        --accent: #d97a4d;
        --accent-dim: #7a4a34;
        --teal: #4dbf9c;
        --amber: #e0a83f;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      #app {
        display: grid;
        grid-template-columns: 1fr 340px;
        height: 100vh;
      }
      @media (max-width: 860px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }
        #memory-panel {
          max-height: 40vh;
        }
      }

      /* ---------- Header ---------- */
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 8px var(--teal);
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.2px;
      }
      header .sub {
        color: var(--text-dim);
        font-size: 12px;
        font-family: var(--mono);
      }
      header .spacer {
        flex: 1;
      }
      header input {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        width: 140px;
      }
      header label {
        color: var(--text-dim);
        font-size: 11px;
        font-family: var(--mono);
        margin-right: 4px;
      }

      /* ---------- Chat column ---------- */
      #chat-col {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        max-width: 640px;
        line-height: 1.55;
      }
      .msg.user {
        align-self: flex-end;
        text-align: right;
      }
      .msg .bubble {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 10px;
        text-align: left;
      }
      .msg.user .bubble {
        background: var(--accent-dim);
        color: #fbe4d8;
      }
      .msg.assistant .bubble {
        background: var(--panel-2);
        border: 1px solid var(--border);
      }
      .msg .role {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .tool-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--amber);
        background: rgba(224, 168, 63, 0.1);
        border: 1px solid rgba(224, 168, 63, 0.35);
        padding: 3px 9px;
        border-radius: 999px;
        align-self: flex-start;
        width: fit-content;
      }
      .tool-chip.done {
        color: var(--teal);
        border-color: rgba(77, 191, 156, 0.35);
        background: rgba(77, 191, 156, 0.1);
      }
      .tool-chip .spin {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cursor {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: var(--accent);
        margin-left: 2px;
        animation: blink 1s step-start infinite;
        vertical-align: -2px;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      #composer {
        display: flex;
        gap: 10px;
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      #composer textarea {
        flex: 1;
        resize: none;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        height: 44px;
        line-height: 1.4;
      }
      #composer textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      #composer button {
        background: var(--accent);
        color: #1a1210;
        border: none;
        font-weight: 600;
        font-size: 13px;
        padding: 0 20px;
        border-radius: 8px;
        cursor: pointer;
      }
      #composer button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ---------- Memory panel ---------- */
      #memory-panel {
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #memory-panel .panel-head {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
      }
      #memory-panel .panel-head h2 {
        font-size: 12px;
        margin: 0 0 2px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-dim);
      }
      #memory-panel .panel-head .count {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
      }
      #memory-tabs {
        display: flex;
        gap: 4px;
        padding: 10px 16px 0;
      }
      #memory-tabs button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      #memory-tabs button.active {
        color: var(--text);
        border-color: var(--accent);
        background: rgba(217, 122, 77, 0.08);
      }
      #memory-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mem-card {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.5;
        animation: pop 0.25s ease;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .mem-card .k {
        color: var(--text-dim);
        word-break: break-all;
      }
      .mem-card .v {
        color: var(--text);
        white-space: pre-wrap;
        margin-top: 4px;
      }
      .empty-hint {
        color: var(--text-dim);
        font-size: 12px;
        padding: 20px 4px;
        font-family: var(--sans);
      }
      #memory-panel .panel-foot {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
      }
      #memory-panel .panel-foot button {
        width: 100%;
        background: transparent;
        border: 1px solid #5a2b2b;
        color: #e08787;
        font-size: 12px;
        padding: 7px;
        border-radius: 6px;
        cursor: pointer;
        font-family: var(--mono);
      }
      #memory-panel .panel-foot button:hover {
        background: rgba(224, 135, 135, 0.08);
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="dot"></span>
        <h1>Support agent</h1>
        <span class="sub" id="thread-label">thread · —</span>
        <div class="spacer"></div>
        <label>user</label>
        <input id="user-id-input" value="sana_01" spellcheck="false" />
        <label style="margin-left: 8px">thread</label>
        <input id="thread-id-input" value="conv-001" spellcheck="false" />
      </header>

      <div id="chat-col">
        <div id="messages"></div>
        <form id="composer">
          <textarea
            id="input"
            placeholder="Message the support agent…"
            rows="1"
          ></textarea>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>

      <aside id="memory-panel">
        <div class="panel-head">
          <h2>Long-term memory</h2>
          <span class="count" id="mem-count">0 semantic · 0 episodic</span>
        </div>
        <div id="memory-tabs">
          <button class="active" data-tab="semantic">semantic</button>
          <button data-tab="episodic">episodic</button>
        </div>
        <div id="memory-list"></div>
        <div class="panel-foot">
          <button id="wipe-btn" type="button">Erase this user's memory</button>
        </div>
      </aside>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("input");
      const composer = document.getElementById("composer");
      const sendBtn = document.getElementById("send-btn");
      const userIdInput = document.getElementById("user-id-input");
      const threadIdInput = document.getElementById("thread-id-input");
      const threadLabel = document.getElementById("thread-label");
      const memoryList = document.getElementById("memory-list");
      const memCount = document.getElementById("mem-count");
      const memoryTabs = document.getElementById("memory-tabs");
      const wipeBtn = document.getElementById("wipe-btn");

      let activeTab = "semantic";
      let lastMemorySnapshot = { semantic: [], episodic: [] };

      threadLabel.textContent = "thread · " + threadIdInput.value;
      threadIdInput.addEventListener("input", () => {
        threadLabel.textContent = "thread · " + threadIdInput.value;
      });

      function addMessage(role, text) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        wrap.innerHTML = `<div class="role">${role}</div><div class="bubble"></div>`;
        wrap.querySelector(".bubble").textContent = text;
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return wrap.querySelector(".bubble");
      }

      function addToolChip(toolName) {
        const chip = document.createElement("div");
        chip.className = "tool-chip";
        chip.dataset.tool = toolName;
        chip.innerHTML = `<span class="spin"></span> ${toolLabel(toolName)}`;
        messagesEl.appendChild(chip);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return chip;
      }

      function resolveToolChip(chip, toolName) {
        chip.classList.add("done");
        chip.innerHTML = `✓ ${toolLabel(toolName)}`;
      }

      function toolLabel(name) {
        const labels = {
          manage_memory: "writing to semantic memory…",
          search_memory: "searching semantic memory…",
          record_episode: "recording episode…",
          recall_similar_episodes: "recalling similar episodes…",
          mem0_remember: "writing to memory (mem0)…",
          mem0_recall: "recalling memory (mem0)…",
        };
        return labels[name] || `using ${name}…`;
      }

      // ---- SSE parsing over fetch (EventSource can't send a POST body) ----
      async function streamChat(
        userId,
        threadId,
        message,
        onToken,
        onToolStart,
        onToolEnd,
        onDone,
        onError,
      ) {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            thread_id: threadId,
            message,
          }),
        });
        if (!res.ok || !res.body) {
          onError("Request failed: " + res.status);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let frameEnd;
          while ((frameEnd = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, frameEnd);
            buffer = buffer.slice(frameEnd + 2);
            const eventMatch = frame.match(/^event: (.+)$/m);
            const dataMatch = frame.match(/^data: (.+)$/m);
            if (!eventMatch || !dataMatch) continue;

            const eventType = eventMatch[1];
            const data = JSON.parse(dataMatch[1]);

            if (eventType === "token") onToken(data.content);
            else if (eventType === "tool_start") onToolStart(data.tool);
            else if (eventType === "tool_end") onToolEnd(data.tool);
            else if (eventType === "error") onError(data.detail);
            else if (eventType === "done") onDone(data);
          }
        }
      }

      composer.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = inputEl.value.trim();
        if (!message) return;

        const userId = userIdInput.value.trim() || "anonymous";
        const threadId = threadIdInput.value.trim() || "default";

        addMessage("user", message);
        inputEl.value = "";
        sendBtn.disabled = true;

        const replyBubble = addMessage("assistant", "");
        replyBubble.innerHTML = '<span class="cursor"></span>';
        let replyText = "";
        const openChips = new Map();

        try {
          await streamChat(
            userId,
            threadId,
            message,
            (token) => {
              replyText += token;
              replyBubble.textContent = replyText;
              replyBubble.insertAdjacentHTML(
                "beforeend",
                '<span class="cursor"></span>',
              );
              messagesEl.scrollTop = messagesEl.scrollHeight;
            },
            (toolName) => {
              const chip = addToolChip(toolName);
              openChips.set(toolName, chip);
            },
            (toolName) => {
              const chip = openChips.get(toolName);
              if (chip) resolveToolChip(chip, toolName);
            },
            async () => {
              replyBubble.textContent = replyText;
              sendBtn.disabled = false;
              await refreshMemories(userId);
            },
            (detail) => {
              replyBubble.textContent = replyText || "Error: " + detail;
              sendBtn.disabled = false;
            },
          );
        } catch (err) {
          replyBubble.textContent = "Connection error: " + err.message;
          sendBtn.disabled = false;
        }
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          composer.requestSubmit();
        }
      });

      // ---- Memory panel ----
      memoryTabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        activeTab = btn.dataset.tab;
        [...memoryTabs.children].forEach((b) =>
          b.classList.toggle("active", b === btn),
        );
        renderMemoryList();
      });

      function renderMemoryList() {
        const items = lastMemorySnapshot[activeTab] || [];
        memoryList.innerHTML = "";
        if (items.length === 0) {
          memoryList.innerHTML =
            '<div class="empty-hint">No ' +
            activeTab +
            " memories yet — chat with the agent and tell it something worth remembering.</div>";
          return;
        }
        for (const item of items) {
          const card = document.createElement("div");
          card.className = "mem-card";
          card.innerHTML = `<div class="k">${item.key}</div><div class="v"></div>`;
          card.querySelector(".v").textContent = JSON.stringify(
            item.value,
            null,
            2,
          );
          memoryList.appendChild(card);
        }
      }

      async function refreshMemories(userId) {
        try {
          const res = await fetch(
            `/users/${encodeURIComponent(userId)}/memories`,
          );
          if (!res.ok) return;
          const data = await res.json();
          lastMemorySnapshot = {
            semantic: data.semantic,
            episodic: data.episodic,
          };
          memCount.textContent = `${data.semantic.length} semantic · ${data.episodic.length} episodic`;
          renderMemoryList();
        } catch (_) {
          /* best-effort refresh, ignore transient failures */
        }
      }

      wipeBtn.addEventListener("click", async () => {
        const userId = userIdInput.value.trim();
        if (!userId) return;
        if (
          !confirm(
            `Erase all stored memory for "${userId}"? This can't be undone.`,
          )
        )
          return;
        await fetch(`/users/${encodeURIComponent(userId)}/memories`, {
          method: "DELETE",
        });
        await refreshMemories(userId);
      });

      userIdInput.addEventListener("change", () =>
        refreshMemories(userIdInput.value.trim()),
      );

      // Initial load
      refreshMemories(userIdInput.value.trim());
    </script>
  </body>
</html>
