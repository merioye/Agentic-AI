<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Support Console</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap");

      :root {
        --bg: #12141c;
        --panel: #191c27;
        --panel-line: #2a2e3d;
        --text: #e8e6e1;
        --text-dim: #8b8fa3;
        --accent: #c98a3e;
        --accent-dim: #7a5a30;
        --agent: #4fa3a0;
        --danger: #c9603e;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Inter", -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        display: flex;
        justify-content: center;
      }

      .shell {
        width: 100%;
        max-width: 880px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--panel-line);
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        font-size: 20px;
        margin: 4px 0 12px;
        font-weight: 600;
      }

      .identity-row {
        display: flex;
        gap: 10px;
        align-items: center;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
      }
      select,
      input[type="text"] {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--panel-line);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 12px;
      }
      select:focus,
      input:focus {
        outline: 1px solid var(--accent);
      }

      .log {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .turn {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .turn-index {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        width: 34px;
        padding-top: 10px;
        text-align: right;
        flex-shrink: 0;
      }
      .bubble {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 10px;
        line-height: 1.5;
        font-size: 14.5px;
        white-space: pre-wrap;
      }
      .turn.user {
        flex-direction: row-reverse;
      }
      .turn.user .turn-index {
        text-align: left;
      }
      .turn.user .bubble {
        background: var(--panel);
        border: 1px solid var(--panel-line);
      }
      .turn.agent .bubble {
        background: rgba(79, 163, 160, 0.1);
        border: 1px solid rgba(79, 163, 160, 0.35);
      }
      .who {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .turn.agent .who {
        color: var(--agent);
      }

      .approval {
        border: 1px solid var(--accent-dim);
        background: rgba(201, 138, 62, 0.1);
        border-radius: 10px;
        padding: 12px 14px;
        max-width: 75%;
      }
      .approval .label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      .approval .action {
        font-size: 13px;
        margin-bottom: 10px;
        color: var(--text);
      }
      .approval button {
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--panel-line);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        margin-right: 8px;
      }
      .approval button.approve {
        border-color: var(--agent);
        color: var(--agent);
      }
      .approval button.reject {
        border-color: var(--danger);
        color: var(--danger);
      }
      .approval button:hover {
        filter: brightness(1.2);
      }

      .escalated {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        margin-top: 6px;
      }

      footer {
        padding: 16px 24px 20px;
        border-top: 1px solid var(--panel-line);
        display: flex;
        gap: 10px;
      }
      footer input[type="text"] {
        flex: 1;
        font-family: var(--sans);
        font-size: 14px;
        padding: 10px 14px;
      }
      footer button {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--accent);
        color: #191108;
        border: none;
        border-radius: 6px;
        padding: 0 20px;
        cursor: pointer;
        font-weight: 700;
      }
      footer button:hover {
        filter: brightness(1.08);
      }
      footer button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .status-line {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        padding: 0 24px 10px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="eyebrow">Acme Retail // Agent Console</div>
        <h1>Support Agent — Live Session</h1>
        <div class="identity-row">
          <span>identity</span>
          <select id="identity">
            <option value="guest-key">guest-key (unauthenticated)</option>
            <option value="customer-key-1" selected>
              customer-key-1 (cust-1)
            </option>
            <option value="customer-key-2">customer-key-2 (cust-2)</option>
            <option value="admin-key">admin-key (support admin)</option>
          </select>
          <span>·</span>
          <span>api</span>
          <input
            id="base-url"
            type="text"
            value="http://localhost:8000"
            size="24"
          />
          <span>·</span>
          <button
            id="reset"
            style="
              font-family: var(--mono);
              font-size: 11px;
              background: transparent;
              color: var(--text-dim);
              border: 1px solid var(--panel-line);
              border-radius: 6px;
              padding: 4px 8px;
              cursor: pointer;
            "
          >
            new conversation
          </button>
        </div>
      </header>

      <div class="log" id="log"></div>
      <div class="status-line" id="status">thread: —</div>

      <footer>
        <input
          id="input"
          type="text"
          placeholder="Ask about an order, request a refund…"
          autocomplete="off"
        />
        <button id="send">Send</button>
      </footer>
    </div>

    <script>
      let conversationId = crypto.randomUUID();
      let turnIndex = 0;

      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const identityEl = document.getElementById("identity");
      const baseUrlEl = document.getElementById("base-url");
      const statusEl = document.getElementById("status");
      const resetBtn = document.getElementById("reset");

      function refreshStatus() {
        statusEl.textContent = `thread: ${conversationId}  ·  identity: ${identityEl.value}`;
      }
      refreshStatus();
      identityEl.addEventListener("change", refreshStatus);

      resetBtn.addEventListener("click", () => {
        conversationId = crypto.randomUUID();
        turnIndex = 0;
        logEl.innerHTML = "";
        refreshStatus();
      });

      function addTurn(role, text) {
        turnIndex += 1;
        const turn = document.createElement("div");
        turn.className = `turn ${role}`;
        turn.innerHTML = `
      <div class="turn-index">${String(turnIndex).padStart(2, "0")}</div>
      <div>
        <div class="who">${role === "user" ? "you" : "agent"}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>`;
        logEl.appendChild(turn);
        logEl.scrollTop = logEl.scrollHeight;
        return turn;
      }

      function addApproval(description) {
        const wrap = document.createElement("div");
        wrap.className = "turn agent";
        wrap.innerHTML = `
      <div class="turn-index"></div>
      <div class="approval">
        <div class="label">Approval required</div>
        <div class="action">${escapeHtml(description || "Sensitive action pending review")}</div>
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </div>`;
        logEl.appendChild(wrap);
        logEl.scrollTop = logEl.scrollHeight;

        wrap.querySelector(".approve").onclick = () => resume("approve", wrap);
        wrap.querySelector(".reject").onclick = () => resume("reject", wrap);
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      // Day 1.5: streams from /chat/stream (SSE) instead of waiting for the
      // full /chat response. Tokens are appended to the bubble as they arrive.
      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        sendBtn.disabled = true;
        addTurn("user", text);

        const agentTurn = addTurn("agent", "");
        const bubble = agentTurn.querySelector(".bubble");
        let finalEvent = null;

        try {
          const res = await fetch(`${baseUrlEl.value}/chat/stream`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": identityEl.value,
            },
            body: JSON.stringify({
              conversation_id: conversationId,
              message: text,
            }),
          });
          if (!res.ok || !res.body) {
            bubble.textContent = `Error: ${res.statusText}`;
            return;
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            // SSE frames are separated by a blank line ("\n\n")
            const frames = buffer.split("\n\n");
            buffer = frames.pop(); // last (possibly incomplete) frame stays buffered

            for (const frame of frames) {
              const line = frame
                .split("\n")
                .find((l) => l.startsWith("data: "));
              if (!line) continue;
              const event = JSON.parse(line.slice("data: ".length));

              if (event.type === "token") {
                bubble.textContent += event.text;
                logEl.scrollTop = logEl.scrollHeight;
              } else if (event.type === "done") {
                finalEvent = event;
              }
            }
          }

          if (finalEvent) {
            if (finalEvent.requires_approval) {
              bubble.textContent = "";
              agentTurn.remove(); // approval gets its own dedicated card
              addApproval(finalEvent.pending_action);
            } else {
              bubble.textContent = finalEvent.message || bubble.textContent;
              if (finalEvent.escalate_to_human) {
                const flag = document.createElement("div");
                flag.className = "escalated";
                flag.textContent = "⚠ flagged for human follow-up";
                bubble.after(flag);
              }
            }
          }
        } catch (err) {
          bubble.textContent = `Connection error: ${err.message}`;
        } finally {
          sendBtn.disabled = false;
        }
      }

      async function resume(decision, approvalNode) {
        approvalNode
          .querySelectorAll("button")
          .forEach((b) => (b.disabled = true));
        try {
          const res = await fetch(`${baseUrlEl.value}/chat/resume`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": identityEl.value,
            },
            body: JSON.stringify({ conversation_id: conversationId, decision }),
          });
          const data = await res.json();
          handleResponse(data);
        } catch (err) {
          addTurn("agent", `Connection error: ${err.message}`);
        }
      }

      function handleResponse(data) {
        if (data.requires_approval) {
          addApproval(data.pending_action);
          return;
        }
        const turn = addTurn("agent", data.message);
        if (data.escalate_to_human) {
          const flag = document.createElement("div");
          flag.className = "escalated";
          flag.textContent = "⚠ flagged for human follow-up";
          turn.querySelector("div:last-child").after(flag);
        }
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
      });
    </script>
  </body>
</html>
