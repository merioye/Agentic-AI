<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP DevOps Agent</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1b1e24;
        --panel-2: #20242b;
        --border: #2b2f38;
        --text: #e7e6e2;
        --text-dim: #8b8d96;
        --accent: #4dbf9c;
        --accent-dim: #2e5c4d;
        --amber: #e0a83f;
        --pink: #d9749d;
        --blue: #5b9bd9;
        --mono: "SFMono-Regular", Consolas, Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
      }
      #app {
        display: grid;
        grid-template-columns: 1fr 340px;
        height: 100vh;
      }
      @media (max-width: 860px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }
        #side-panel {
          max-height: 40vh;
        }
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      header .sub {
        color: var(--text-dim);
        font-size: 12px;
        font-family: var(--mono);
      }

      #chat-col {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg {
        max-width: 640px;
        line-height: 1.55;
      }
      .msg.user {
        align-self: flex-end;
        text-align: right;
      }
      .msg .bubble {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 10px;
        text-align: left;
      }
      .msg.user .bubble {
        background: var(--accent-dim);
        color: #dff5ec;
      }
      .msg.assistant .bubble {
        background: var(--panel-2);
        border: 1px solid var(--border);
      }
      .msg .role {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .tool-chip {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        font-family: var(--mono);
        font-size: 11px;
        padding: 6px 10px;
        border-radius: 8px;
        align-self: flex-start;
        width: fit-content;
        max-width: 90%;
        border: 1px solid var(--border);
        background: var(--panel-2);
      }
      .tool-chip .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tool-chip .server-tag {
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .tool-chip.server-devops .server-tag {
        background: rgba(224, 168, 63, 0.15);
        color: var(--amber);
        border: 1px solid rgba(224, 168, 63, 0.4);
      }
      .tool-chip.server-filesystem .server-tag {
        background: rgba(91, 155, 217, 0.15);
        color: var(--blue);
        border: 1px solid rgba(91, 155, 217, 0.4);
      }
      .tool-chip.server-unknown .server-tag {
        background: rgba(217, 116, 157, 0.15);
        color: var(--pink);
        border: 1px solid rgba(217, 116, 157, 0.4);
      }
      .tool-chip .spin {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .tool-chip.done .spin {
        display: none;
      }
      .tool-chip .out {
        color: var(--text-dim);
        font-size: 10.5px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .cursor {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: var(--accent);
        margin-left: 2px;
        animation: blink 1s step-start infinite;
        vertical-align: -2px;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      #composer {
        display: flex;
        gap: 10px;
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      #composer textarea {
        flex: 1;
        resize: none;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        height: 44px;
        line-height: 1.4;
      }
      #composer textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      #composer button {
        background: var(--accent);
        color: #0f1c17;
        border: none;
        font-weight: 600;
        font-size: 13px;
        padding: 0 20px;
        border-radius: 8px;
        cursor: pointer;
      }
      #composer button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #side-panel {
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #side-panel .panel-head {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
      }
      #side-panel .panel-head h2 {
        font-size: 12px;
        margin: 0 0 2px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-dim);
      }
      #side-panel .panel-head .count {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
      }
      #tool-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tool-card {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .tool-card .name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
      }
      .tool-card .desc {
        font-size: 11.5px;
        color: var(--text-dim);
        margin-top: 3px;
        line-height: 1.4;
      }
      .tool-card .server-tag {
        display: inline-block;
        margin-top: 6px;
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-family: var(--mono);
      }
      .tool-card.server-devops .server-tag {
        background: rgba(224, 168, 63, 0.15);
        color: var(--amber);
        border: 1px solid rgba(224, 168, 63, 0.4);
      }
      .tool-card.server-filesystem .server-tag {
        background: rgba(91, 155, 217, 0.15);
        color: var(--blue);
        border: 1px solid rgba(91, 155, 217, 0.4);
      }
      .empty-hint {
        color: var(--text-dim);
        font-size: 12px;
        padding: 20px 4px;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="dot"></span>
        <h1>MCP DevOps Agent</h1>
        <span class="sub" id="thread-label">thread · conv-001</span>
      </header>

      <div id="chat-col">
        <div id="messages"></div>
        <form id="composer">
          <textarea
            id="input"
            placeholder="Ask about a service, or say 'restart notifications-worker'…"
            rows="1"
          ></textarea>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>

      <aside id="side-panel">
        <div class="panel-head">
          <h2>Connected MCP tools</h2>
          <span class="count" id="tool-count">loading…</span>
        </div>
        <div id="tool-list"></div>
      </aside>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("input");
      const composer = document.getElementById("composer");
      const sendBtn = document.getElementById("send-btn");
      const toolList = document.getElementById("tool-list");
      const toolCount = document.getElementById("tool-count");
      const threadId = "conv-001";

      function addMessage(role, text) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        wrap.innerHTML = `<div class="role">${role}</div><div class="bubble"></div>`;
        wrap.querySelector(".bubble").textContent = text;
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return wrap.querySelector(".bubble");
      }

      function addToolChip(toolName, server) {
        const chip = document.createElement("div");
        chip.className = `tool-chip server-${server}`;
        chip.innerHTML = `<div class="row"><span class="spin"></span><span>${toolName}</span><span class="server-tag">${server}</span></div>`;
        messagesEl.appendChild(chip);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return chip;
      }

      function resolveToolChip(chip, output) {
        chip.classList.add("done");
        const row = chip.querySelector(".row");
        row.innerHTML = row.innerHTML.replace(
          /<span class="spin"><\/span>/,
          "✓",
        );
        if (output) {
          const out = document.createElement("div");
          out.className = "out";
          out.textContent = output;
          chip.appendChild(out);
        }
      }

      async function streamChat(threadId, message, handlers) {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ thread_id: threadId, message }),
        });
        if (!res.ok || !res.body) {
          handlers.onError("Request failed: " + res.status);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let frameEnd;
          while ((frameEnd = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, frameEnd);
            buffer = buffer.slice(frameEnd + 2);
            const eventMatch = frame.match(/^event: (.+)$/m);
            const dataMatch = frame.match(/^data: (.+)$/m);
            if (!eventMatch || !dataMatch) continue;
            const eventType = eventMatch[1];
            const data = JSON.parse(dataMatch[1]);
            if (eventType === "token") handlers.onToken(data.content);
            else if (eventType === "tool_start")
              handlers.onToolStart(data.tool, data.server);
            else if (eventType === "tool_end")
              handlers.onToolEnd(data.tool, data.server, data.output);
            else if (eventType === "tool_error")
              handlers.onToolError(data.tool, data.detail);
            else if (eventType === "error") handlers.onError(data.detail);
            else if (eventType === "done") handlers.onDone(data);
          }
        }
      }

      composer.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = inputEl.value.trim();
        if (!message) return;

        addMessage("user", message);
        inputEl.value = "";
        sendBtn.disabled = true;

        const replyBubble = addMessage("assistant", "");
        replyBubble.innerHTML = '<span class="cursor"></span>';
        let replyText = "";
        const openChips = new Map();

        try {
          await streamChat(threadId, message, {
            onToken: (token) => {
              replyText += token;
              replyBubble.textContent = replyText;
              replyBubble.insertAdjacentHTML(
                "beforeend",
                '<span class="cursor"></span>',
              );
              messagesEl.scrollTop = messagesEl.scrollHeight;
            },
            onToolStart: (tool, server) => {
              openChips.set(tool, addToolChip(tool, server));
            },
            onToolEnd: (tool, server, output) => {
              const chip = openChips.get(tool);
              if (chip) resolveToolChip(chip, output);
            },
            onToolError: (tool, detail) => {
              const chip = openChips.get(tool);
              if (chip) resolveToolChip(chip, "Error: " + detail);
            },
            onDone: () => {
              replyBubble.textContent = replyText;
              sendBtn.disabled = false;
            },
            onError: (detail) => {
              replyBubble.textContent = replyText || "Error: " + detail;
              sendBtn.disabled = false;
            },
          });
        } catch (err) {
          replyBubble.textContent = "Connection error: " + err.message;
          sendBtn.disabled = false;
        }
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          composer.requestSubmit();
        }
      });

      async function loadTools() {
        try {
          const res = await fetch("/tools");
          const data = await res.json();
          toolCount.textContent = `${data.tools.length} tools across ${new Set(data.tools.map((t) => t.server)).size} servers`;
          toolList.innerHTML = "";
          for (const t of data.tools) {
            const card = document.createElement("div");
            card.className = `tool-card server-${t.server}`;
            card.innerHTML = `<div class="name">${t.name}</div><div class="desc">${t.description}</div><span class="server-tag">${t.server}</span>`;
            toolList.appendChild(card);
          }
          if (data.tools.length === 0)
            toolList.innerHTML =
              '<div class="empty-hint">No tools loaded.</div>';
        } catch (_) {
          toolCount.textContent = "failed to load";
        }
      }

      loadTools();
    </script>
  </body>
</html>
